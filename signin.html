<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign In - Stackly IT Solutions</title>

    <link rel="stylesheet"
          href="style.css">

    <style>

        body{
            margin:0;
            background:#0F172A;
            font-family:Poppins,sans-serif;
            color:white;
        }

        .login-container{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .login-box{
            background:#1E293B;
            padding:40px;
            width:400px;
            border-radius:15px;
        }

        .login-box h2{
            text-align:center;
            margin-bottom:25px;
        }

        .login-box input{
            width:100%;
            padding:15px;
            margin-bottom:15px;
            border:none;
            border-radius:8px;
            background:#0F172A;
            color:white;
        }

        .login-box button{
            width:100%;
            padding:15px;
            background:#06B6D4;
            border:none;
            color:white;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }

        .login-box p{
            text-align:center;
            margin-top:20px;
        }

        .login-box a{
            color:#F97316;
            text-decoration:none;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h2>Sign In</h2>

            <input type="email"
                   placeholder="Enter Email">

            <input type="password"
                   placeholder="Enter Password">

            <button onclick="login()">

                Login

            </button>

            <p>

                Back to
                <a href="index.html">
                    Home
                </a>

            </p>

        </div>

    </div>

    <script>

        function login(){

            window.location.href =
            "404.html";

        }

    </script>

</body>

</html>
