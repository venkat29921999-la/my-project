<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>404 - Page Not Found</title>

    <link rel="stylesheet"
          href="style.css">

    <style>

        body{
            margin:0;
            padding:0;
            background:#0F172A;
            color:white;
            font-family:Poppins,sans-serif;
        }

        .error-container{
            height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            text-align:center;
            padding:20px;
        }

        .error-container h1{
            font-size:120px;
            color:#06B6D4;
            margin:0;
        }

        .error-container h2{
            font-size:40px;
            margin:10px 0;
        }

        .error-container p{
            color:#cbd5e1;
            margin-bottom:30px;
        }

        .error-container button{
            background:#F97316;
            color:white;
            border:none;
            padding:15px 30px;
            border-radius:10px;
            cursor:pointer;
            font-size:16px;
        }

        .error-container button:hover{
            opacity:0.9;
        }

    </style>

</head>

<body>

    <div class="error-container">

        <h1>404</h1>

        <h2>Page Not Found</h2>

        <p>

            Sorry, the page you are looking for
            does not exist.

        </p>

        <button onclick="goHome()">

            Back To Home

        </button>

    </div>

    <script>

        function goHome(){

            window.location.href =
            "index.html";

        }

    </script>

</body>

</html>
